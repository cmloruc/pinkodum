<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pin Kodum</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d18;
      --surface: #111827;
      --gold: #dfbd3b;
      --text: #f5f0df;
      --muted: #b8b09d;
      --border: rgba(223, 189, 59, 0.24);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #151b31 0, var(--bg) 42rem);
      color: var(--text);
      line-height: 1.6;
    }
    main {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
      padding: 72px 0;
    }
    .mark {
      width: 72px;
      height: 72px;
      border: 1px solid var(--border);
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: var(--gold);
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 24px;
      background: rgba(223, 189, 59, 0.08);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(36px, 7vw, 56px);
      letter-spacing: 0;
      color: var(--gold);
    }
    p { color: var(--muted); font-size: 18px; }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }
    a {
      color: var(--bg);
      background: linear-gradient(135deg, #f4d84d, #b99a20);
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: 700;
    }
    .secondary {
      color: var(--gold);
      background: transparent;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">PK</div>
    <h1>Pin Kodum</h1>
    <p>Pin Kodum, numeroloji temelli kişisel farkındalık ve ilişki analizi uygulamasıdır.</p>
    <nav>
      <a href="./support.html">Destek</a>
      <a class="secondary" href="./privacy.html">Gizlilik Politikası</a>
    </nav>
  </main>
</body>
</html>
